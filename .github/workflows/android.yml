name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370 cmake;4.1.2'
      - name: Native protocol tests
        run: bash scripts/check-native.sh
      - name: Tests, Kotlin style, Android lint and APKs
        run: ./gradlew --no-daemon lintKotlin :core:test :adb:testDebugUnitTest :pairing-native:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :fixture:assembleDebug lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buddy-development-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM for fixture probes
        run: sudo chmod a+rw /dev/kvm
      - name: Android fixture probes on API 36
        id: device
        timeout-minutes: 10
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-build: '16696583'
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2
          disable-animations: true
          script: |
            adb install -r fixture/build/outputs/apk/debug/fixture-debug.apk
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            ./gradlew --no-daemon --no-parallel --continue -Pandroid.testInstrumentationRunnerArguments.buddyPairingFixture=true -Pandroid.testInstrumentationRunnerArguments.timeout_msec=60000 :pairing-native:connectedDebugAndroidTest :storage:connectedDebugAndroidTest :fixture:connectedDebugAndroidTest :app:connectedDebugAndroidTest

      - name: Report device test results
        if: always() && steps.device.outcome != 'skipped'
        run: python3 scripts/report-device-tests.py
      - name: Preserve device test XML
        if: always() && steps.device.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buddy-device-test-results
          path: '**/build/outputs/androidTest-results/**/*.xml'
          if-no-files-found: ignore
