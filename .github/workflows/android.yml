name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2'
      - name: Native protocol tests
        run: bash scripts/check-native.sh
      - name: Tests, Kotlin style, Android lint and APKs
        run: ./gradlew --no-daemon lintKotlin :core:test :pairing-native:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :fixture:assembleDebug lintDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buddy-development-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: error
