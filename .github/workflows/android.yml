name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (Android ${{ matrix.image-api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-api: '36'
            target: google_apis_playstore
            page-size: '4096'
          - image-api: '37.2'
            target: google_apis_playstore_ps16k
            page-size: '16384'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0 ndk;30.0.16248370 cmake;4.1.2 emulator system-images;android-${{ matrix.image-api }};${{ matrix.target }};x86_64'
      - name: Native protocol tests
        run: bash scripts/check-native.sh
      - name: Use one debug signing identity for this test run
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$RUNNER_TEMP/buddy-debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Buddy Android CI" -keyalg RSA -keysize 2048 -validity 3650
          printf 'BUDDY_DEBUG_KEYSTORE=%s\n' "$RUNNER_TEMP/buddy-debug.keystore" >> "$GITHUB_ENV"
      - name: Tests, Kotlin style, Android lint and APKs
        run: |
          ./gradlew --no-daemon lintKotlin :core:test :adb:testDebugUnitTest :pairing-native:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :fixture:assembleDebug lintDebug
          ./gradlew --no-daemon --no-parallel --max-workers=2 :app:assembleRelease :fixture:assembleRelease lintRelease
      - name: Verify APK signatures, alignment and optimized entry points
        run: |
          python3 scripts/check-apk-signatures.py
          python3 scripts/check-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buddy-development-apks-api${{ matrix.image-api }}
          path: |
            app/build/outputs/apk/debug/*.apk
            fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Enable KVM for fixture probes
        run: sudo chmod a+rw /dev/kvm
      - name: Android fixture probes on API ${{ matrix.image-api }} user image
        id: device
        timeout-minutes: 10
        env:
          BUDDY_EXPECTED_PAGE_SIZE: ${{ matrix.page-size }}
          BUDDY_IMAGE_API: ${{ matrix.image-api }}
          BUDDY_IMAGE_TARGET: ${{ matrix.target }}
        run: bash scripts/run-emulator.sh

      - name: Report device test results
        if: always() && steps.device.outcome != 'skipped'
        run: python3 scripts/report-device-tests.py
      - name: Preserve device test XML
        if: always() && steps.device.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: buddy-device-test-results-api${{ matrix.image-api }}
          path: '**/build/outputs/androidTest-results/**/*.xml'
          if-no-files-found: ignore
