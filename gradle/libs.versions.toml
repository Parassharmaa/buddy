[versions]
agp = "9.5.0"
kotlin = "2.4.21"
compose = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization = "1.12.0"
junit = "4.13.2"
ktlint = "1.8.0"
room = "2.8.5"
ksp = "2.3.13"

[libraries]
webkit = { module = "androidx.webkit:webkit", version = "1.18.0" }
work-runtime = { module = "androidx.work:work-runtime", version = "2.12.0" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
ktlint = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version = "1.3.0" }
adaptive-navigation = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version = "1.4.0" }

robolectric = { module = "org.robolectric:robolectric", version = "4.17" }
robolectricSdk = { module = "org.robolectric:android-all-instrumented", version = "16-robolectric-13921718-i7" }
test-core = { module = "androidx.test:core", version = "1.7.0" }
test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
compose-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.1" }

test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.4.0" }

test-runner = { module = "androidx.test:runner", version = "1.7.0" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-app = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
